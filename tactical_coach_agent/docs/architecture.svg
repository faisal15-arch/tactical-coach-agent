<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Space Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9fb3a8"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f2c14e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1200" fill="#0b1f17"/>
  <rect width="1000" height="1200" fill="url(#glow)"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f2c14e" font-size="20" font-weight="700" letter-spacing="1">TACTICAL COACH — SYSTEM ARCHITECTURE</text>
  <text x="500" y="68" text-anchor="middle" fill="#9fb3a8" font-size="12">React → FastAPI → LangGraph → Gemini, with Postgres + Redis</text>

  <!-- React Frontend -->
  <rect x="350" y="100" width="300" height="60" rx="6" fill="#12291f" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="500" y="125" text-anchor="middle" fill="#f2f0e6" font-size="14" font-weight="700">Coach Dashboard + Chatbot</text>
  <text x="500" y="145" text-anchor="middle" fill="#9fb3a8" font-size="11">React (Vite)</text>

  <line x1="500" y1="160" x2="500" y2="195" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="182" fill="#9fb3a8" font-size="10">HTTP POST /api/chat</text>

  <!-- FastAPI -->
  <rect x="350" y="200" width="300" height="60" rx="6" fill="#12291f" stroke="#2a4a3b" stroke-width="1.5"/>
  <text x="500" y="225" text-anchor="middle" fill="#f2f0e6" font-size="14" font-weight="700">FastAPI Server</text>
  <text x="500" y="245" text-anchor="middle" fill="#9fb3a8" font-size="11">main.py — session management, logging</text>

  <!-- Postgres + Redis side boxes -->
  <rect x="700" y="200" width="150" height="55" rx="6" fill="#173327" stroke="#2a4a3b" stroke-width="1"/>
  <text x="775" y="222" text-anchor="middle" fill="#f2f0e6" font-size="11" font-weight="700">Postgres</text>
  <text x="775" y="238" text-anchor="middle" fill="#9fb3a8" font-size="9">query_logs audit trail</text>
  <line x1="650" y1="225" x2="695" y2="225" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="150" y="200" width="150" height="55" rx="6" fill="#173327" stroke="#2a4a3b" stroke-width="1"/>
  <text x="225" y="222" text-anchor="middle" fill="#f2f0e6" font-size="11" font-weight="700">Redis</text>
  <text x="225" y="238" text-anchor="middle" fill="#9fb3a8" font-size="9">session memory + cache</text>
  <line x1="350" y1="225" x2="305" y2="225" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="500" y1="260" x2="500" y2="295" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph Agent container -->
  <rect x="120" y="300" width="760" height="640" rx="8" fill="none" stroke="#f2c14e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="140" y="322" fill="#f2c14e" font-size="12" font-weight="700" letter-spacing="0.5">LANGGRAPH — TACTICAL COACH AGENT</text>

  <!-- Intent Classification -->
  <rect x="350" y="340" width="300" height="55" rx="6" fill="#12291f" stroke="#2a4a3b" stroke-width="1.5"/>
  <text x="500" y="362" text-anchor="middle" fill="#f2f0e6" font-size="13" font-weight="700">Intent Classification</text>
  <text x="500" y="380" text-anchor="middle" fill="#9fb3a8" font-size="10">live_info / bowling_recommendation / follow_up</text>

  <line x1="500" y1="395" x2="500" y2="425" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Router diamond-ish -->
  <rect x="420" y="430" width="160" height="45" rx="22" fill="#173327" stroke="#f2c14e" stroke-width="1.2"/>
  <text x="500" y="457" text-anchor="middle" fill="#f2c14e" font-size="12" font-weight="700">ROUTER</text>

  <!-- Three branches -->
  <line x1="460" y1="475" x2="230" y2="520" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="475" x2="500" y2="520" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="475" x2="770" y2="520" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Live Info branch -->
  <rect x="150" y="525" width="180" height="55" rx="6" fill="#12291f" stroke="#4caf6d" stroke-width="1.2"/>
  <text x="240" y="548" text-anchor="middle" fill="#f2f0e6" font-size="12" font-weight="700">Live Data Tools</text>
  <text x="240" y="565" text-anchor="middle" fill="#9fb3a8" font-size="9">score, pitch, weather</text>

  <!-- Bowling recommendation branch -->
  <rect x="410" y="525" width="180" height="55" rx="6" fill="#12291f" stroke="#f2c14e" stroke-width="1.2"/>
  <text x="500" y="548" text-anchor="middle" fill="#f2f0e6" font-size="12" font-weight="700">Analytics Tools</text>
  <text x="500" y="565" text-anchor="middle" fill="#9fb3a8" font-size="9">pressure, momentum, form, bowler fit</text>

  <!-- Follow-up branch -->
  <rect x="680" y="525" width="180" height="55" rx="6" fill="#12291f" stroke="#e2574c" stroke-width="1.2"/>
  <text x="770" y="548" text-anchor="middle" fill="#f2f0e6" font-size="12" font-weight="700">Follow-up Node</text>
  <text x="770" y="565" text-anchor="middle" fill="#9fb3a8" font-size="9">uses session memory, no recompute</text>

  <line x1="240" y1="580" x2="240" y2="605" stroke="#9fb3a8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="255" y="597" fill="#9fb3a8" font-size="9">END</text>

  <line x1="500" y1="580" x2="500" y2="615" stroke="#9fb3a8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Decision Simulation -->
  <rect x="350" y="620" width="300" height="55" rx="6" fill="#12291f" stroke="#2a4a3b" stroke-width="1.5"/>
  <text x="500" y="643" text-anchor="middle" fill="#f2f0e6" font-size="13" font-weight="700">Decision Simulation Tool</text>
  <text x="500" y="660" text-anchor="middle" fill="#9fb3a8" font-size="10">ranks 2-3 strategies with confidence %</text>

  <line x1="500" y1="675" x2="500" y2="710" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gemini -->
  <rect x="350" y="715" width="300" height="55" rx="6" fill="#12291f" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="500" y="738" text-anchor="middle" fill="#f2f0e6" font-size="13" font-weight="700">Gemini Flash — Reasoning</text>
  <text x="500" y="755" text-anchor="middle" fill="#9fb3a8" font-size="10">explains WHY, never invents numbers</text>

  <line x1="500" y1="770" x2="500" y2="805" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Explainable Recommendation -->
  <rect x="320" y="810" width="360" height="55" rx="6" fill="#173327" stroke="#4caf6d" stroke-width="1.2"/>
  <text x="500" y="833" text-anchor="middle" fill="#f2f0e6" font-size="13" font-weight="700">Explainable Recommendation</text>
  <text x="500" y="850" text-anchor="middle" fill="#9fb3a8" font-size="10">strategy + confidence + reason</text>

  <line x1="770" y1="580" x2="770" y2="837" stroke="#9fb3a8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="770" y1="837" x2="685" y2="837" stroke="#9fb3a8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <line x1="500" y1="865" x2="500" y2="900" stroke="#9fb3a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Back to state -->
  <rect x="350" y="905" width="300" height="20" rx="4" fill="none" stroke="#2a4a3b" stroke-width="1"/>
  <text x="500" y="918" text-anchor="middle" fill="#9fb3a8" font-size="9">updates MatchState</text>

  <!-- Response back to frontend -->
  <line x1="500" y1="940" x2="500" y2="1010" stroke="#f2c14e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="978" fill="#9fb3a8" font-size="10">JSON response</text>

  <rect x="300" y="1015" width="180" height="55" rx="6" fill="#12291f" stroke="#f2c14e" stroke-width="1.2"/>
  <text x="390" y="1038" text-anchor="middle" fill="#f2f0e6" font-size="12" font-weight="700">Chatbot Reply</text>
  <text x="390" y="1055" text-anchor="middle" fill="#9fb3a8" font-size="9">natural language answer</text>

  <rect x="520" y="1015" width="180" height="55" rx="6" fill="#12291f" stroke="#f2c14e" stroke-width="1.2"/>
  <text x="610" y="1038" text-anchor="middle" fill="#f2f0e6" font-size="12" font-weight="700">Dashboard Update</text>
  <text x="610" y="1055" text-anchor="middle" fill="#9fb3a8" font-size="9">pressure, momentum, strategies</text>

  <!-- Legend -->
  <text x="140" y="1110" fill="#9fb3a8" font-size="10" font-weight="700">LEGEND</text>
  <rect x="140" y="1120" width="12" height="12" fill="none" stroke="#4caf6d" stroke-width="1.2"/>
  <text x="160" y="1130" fill="#9fb3a8" font-size="10">Live/deterministic data path</text>
  <rect x="140" y="1140" width="12" height="12" fill="none" stroke="#f2c14e" stroke-width="1.2"/>
  <text x="160" y="1150" fill="#9fb3a8" font-size="10">LLM reasoning path</text>
  <rect x="400" y="1120" width="12" height="12" fill="none" stroke="#e2574c" stroke-width="1.2"/>
  <text x="420" y="1130" fill="#9fb3a8" font-size="10">Follow-up / conversation memory path</text>
</svg>

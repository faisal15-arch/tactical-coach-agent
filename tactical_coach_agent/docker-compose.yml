version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tactical-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach_dev_password
      POSTGRES_DB: tactical_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tactical-coach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
